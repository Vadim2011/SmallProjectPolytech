<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password generator</title>
</head>
<body>
  
  <form action="#" method="get">
    <div>
      <div>name</div>
      <input tabindex="1" placeholder="name" name="usname" type="text">
    </div>

    <div>
      <div>pass</div>
      <input tabindex="2" name="Password" type="password">
    </div>

    <div>
      <div>tel</div>
      <input tabindex="3" name="tel" type="tel">
    </div>

    <div>
      <div>gender</div>
      <input tabindex="4" name="gend" type="radio" value="F">
      <input tabindex="4" name="gend" type="radio" value="M" checked> 
    </div>

    <div>
      <div>
        <span>prop1</span><br>
        <input tabindex="5" type="checkbox" name="prop1" value="prop1">
      </div>
      <div>
        <span>prop2</span><br>
        <input tabindex="6" type="checkbox" name="prop2">
      </div>
      <div>
        <span>prop3</span><br>
        <input tabindex="7" type="checkbox" name="prop2" checked>
      </div>
      <div>
        <span>prop4</span><br>
        <input tabindex="8" type="checkbox" name="prop2" disabled>
      </div>
    </div>

    <div>
      <div>area_text</div>
      <textarea name="area" tabindex="9"></textarea>
    </div>

    <div>
      <div>photo</div>
      <div>
        <input type="file" tabindex="10">
      </div>
    </div>

    <div>
      <p>color</p>
      <!-- multiple -->
      <select name="color" tabindex="11">
        <option value="1">red</option>
        <option value="2">green</option>
        <option value="3">blue</option>
      </select>
    </div>

  <button tabindex="12" type="submit">sub</button>
  <button  tabindex="13" type="reset">reset</button>
  </form>

</body>
</html>
